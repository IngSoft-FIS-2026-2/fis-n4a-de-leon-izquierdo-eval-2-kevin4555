<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <div class="container mt-3">
      <div class="card p-3">
        <h2 class="mb-3">Registro de Película</h2>
        <div class="text-center mb-1">
          <img
            src="https://img.freepik.com/vector-premium/banner-cine-cine_108855-4895.jpg?semt=ais_hybrid&w=740"
          />
        </div>
        <p>
          Completa el siguiente formulario para registrar una película en el
          sistema.
        </p>
        <form class="form-control">
          <div class="mb-3">
            <label class="form-label" for="title">Título de la película</label>
            <input type="text" name="title" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Año de estreno</label>
            <input id="year" name="year" min="1900" max="2026" />
          </div>
          <div class="mb-3">
            <label class="form-label">Director</label>
            <input id="director" name="director" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Vista?</label>
            <input type="checkbox" id="vista" name="vista" />
          </div>
          <div class="mb-3 btn btn-success">
            <button type="submit">Registrar</button>
          </div>
        </form>
        <h2 class="mb-3">Películas registradas</h2>
        <ul id="movie-list"></ul>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="/src/interface/main.ts"></script>
  </body>
</html>
